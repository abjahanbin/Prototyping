<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FACENET-V3</title>
<style>
  body {
    margin: 0;
    background: #ffffff;
    color: #111111;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 2rem;
  }
  canvas {
    width: min(94vw, 1200px);
    height: auto;
    border-radius: 8px;
    background: #000;
    box-shadow: 0 0 0 1px #ddd;
  }
  video {
    display: none; /* hidden source, canvas is what's shown */
  }
  button {
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    background: #111111;
    color: #ffffff;
    border: 1px solid #111111;
    border-radius: 4px;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #status {
    color: #333333;
    font-size: 0.9rem;
  }
  #expressions {
    font-size: 0.9rem;
    min-height: 1.2em;
    text-align: center;
    color: #111111;
  }
  #expressions b {
    color: #0a6ebd;
  }
  #ledgerPanel {
    width: min(94vw, 1200px);
    background: #0a0a0a;
    font-family: ui-monospace, "Cascadia Code", "Courier New", monospace;
    border-radius: 6px;
    box-shadow: 0 0 0 1px #ddd;
    overflow: hidden;
  }
  #ledgerHeader {
    color: #ff8f8f;
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    border-bottom: 1px solid rgba(255, 143, 143, 0.3);
    letter-spacing: 0.03em;
  }
  #ledger {
    height: 140px;
    overflow-y: auto;
    color: #7fd1ff;
    font-size: 0.8rem;
    padding: 0.5rem 0.75rem;
  }
  #ledger div {
    white-space: pre;
    line-height: 1.4;
  }
  #systemInfo {
    width: min(94vw, 1200px);
    background: #0a0a0a;
    font-family: ui-monospace, "Cascadia Code", "Courier New", monospace;
    font-size: 0.75rem;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    box-shadow: 0 0 0 1px #ddd;
    letter-spacing: 0.02em;
  }
  #systemInfo .model {
    color: #7fd1ff;
  }
  #systemInfo .claim {
    color: #ff4d4d;
    margin-top: 0.15rem;
  }
  #systemInfo .case {
    color: #888888;
    margin-top: 0.15rem;
  }
</style>
</head>
<body>

<button id="startBtn">Start FACENET</button>
<div id="status">SYSTEM STANDBY.</div>
<div id="expressions"></div>
<div id="systemInfo">
  <div class="model">MODEL: FACENET-V3 // TRAINED ON: ARCHIVAL LAW-ENFORCEMENT IMAGERY, 1987–2003</div>
  <div class="claim">OBJECTIVE ANALYSIS — NO HUMAN BIAS DETECTED</div>
  <div class="case" id="caseId">CASE #: PENDING</div>
</div>
<canvas id="canvas"></canvas>
<video id="video" playsinline autoplay muted></video>
<div id="ledgerPanel">
  <div id="ledgerHeader">SUBJECTS ON FILE: 000</div>
  <div id="ledger"></div>
</div>

<script type="module" src="/script.js"></script>
</body>
</html>
